name: Build Fabric mod

on:
  push:
    paths: ["BreedingIndicator/**", "IvaUtils/**", "FlightHUD/**", ".github/workflows/mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [BreedingIndicator, IvaUtils, FlightHUD]
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-cleanup: never

      - name: Resolve Fabric versions for 26.1.2
        run: |
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*+26.1.2</version>' | tail -1 | sed 's/<[^>]*>//g')
          LOOM=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5 | sed 's/<[^>]*>//g' | tr '\n' ' ')
          echo "loader=$LOADER api=$API loom-candidates=$LOOM"
          echo "PROPS=-Ploader_version=$LOADER -Pfabric_version=$API" >> $GITHUB_ENV

      - name: Build
        run: gradle build --no-daemon $PROPS

      - name: Probe
        if: ${{ always() && matrix.mod == 'FlightHUD' }}
        run: |
          set +e
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged-deobf-*.jar' | head -1)
          echo "=====PROBE====="
          javap -cp "$J" -p net.minecraft.client.Camera | grep -Ev 'lambda|static final'
          javap -cp "$J" -p net.minecraft.client.MouseHandler | grep -Ei 'turn|accumulat|sensitiv'
          javap -cp "$J" -p net.minecraft.world.entity.Entity | grep -Ei ' turn|setXRot|setYRot|getViewVector|calculateViewVector|lookAngle'
          javap -cp "$J" -p net.minecraft.world.entity.LivingEntity | grep -Ei 'fall|elytra|glid|travel'
          javap -cp "$J" -p net.minecraft.client.renderer.GameRenderer | grep -Ei 'bob|camera|renderLevel|extract'
          javap -cp "$J" -p net.minecraft.client.player.LocalPlayer | grep -Ei 'aiStep|input|fall'
          echo "=====END====="

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ${{ matrix.mod }}
          path: ${{ matrix.mod }}/build/libs/${{ matrix.mod }}-*.jar
