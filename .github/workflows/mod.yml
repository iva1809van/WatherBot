name: Build Fabric mod

on:
  push:
    paths: ["BreedingIndicator/**", ".github/workflows/mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BreedingIndicator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-cleanup: never

      - name: Resolve Fabric versions for 26.1.2
        run: |
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*+26.1.2</version>' | tail -1 | sed 's/<[^>]*>//g')
          LOOM=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5 | sed 's/<[^>]*>//g' | tr '\n' ' ')
          echo "loader=$LOADER api=$API loom-candidates=$LOOM"
          echo "PROPS=-Ploader_version=$LOADER -Pfabric_version=$API" >> $GITHUB_ENV

      - name: Build
        run: gradle build --no-daemon --stacktrace $PROPS

      - name: Probe Minecraft classes
        if: always()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged-deobf-*.jar' | head -1)
          echo "=====PROBE====="
          for c in net.minecraft.client.renderer.entity.EntityRenderer net.minecraft.client.renderer.entity.state.EntityRenderState net.minecraft.client.KeyMapping 'net.minecraft.client.KeyMapping$Category' net.minecraft.world.level.ClipContext; do
            echo "## $c"; javap -cp "$J" -p "$c" 2>&1 | grep -Ev 'lambda\$|^Compiled' | head -60
          done
          unzip -l "$J" | grep -Eo 'net/minecraft/resources/[A-Za-z]+\.class' | head
          for f in $(find ~/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api -name '*.jar' | grep -E 'key-mapping|keybind|lifecycle-events|events-interaction|networking' ); do echo "## $f"; unzip -l "$f" | grep -Eo 'net/fabricmc/fabric/api/client/[^ ]*\.class' | grep -v impl | head -20; done
          echo "=====END====="

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BreedingIndicator
          path: BreedingIndicator/build/libs/BreedingIndicator-*.jar
