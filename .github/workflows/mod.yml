name: Build Fabric mod

on:
  push:
    paths: ["BreedingIndicator/**", ".github/workflows/mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BreedingIndicator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-cleanup: never

      - name: Resolve Fabric versions for 26.1.2
        run: |
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*+26.1.2</version>' | tail -1 | sed 's/<[^>]*>//g')
          LOOM=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5 | sed 's/<[^>]*>//g' | tr '\n' ' ')
          echo "loader=$LOADER api=$API loom-candidates=$LOOM"
          echo "PROPS=-Ploader_version=$LOADER -Pfabric_version=$API" >> $GITHUB_ENV

      - name: Build
        run: gradle build --no-daemon $PROPS

      - name: Probe
        if: always()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged-deobf-*.jar' | head -1)
          echo "=====PROBE====="
          unzip -l "$J" | grep -Eo 'net/minecraft/client/gui/[A-Za-z]*Graphic[A-Za-z]*\.class'
          javap -cp "$J" -p net.minecraft.client.Minecraft | grep -i gizmo
          javap -cp "$J" -p net.minecraft.client.renderer.LevelRenderer | grep -i gizmo
          javap -cp "$J" -p net.minecraft.client.renderer.GameRenderer | grep -i gizmo
          javap -cp "$J" net.minecraft.gizmos.GizmoProperties
          F=$(find ~/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api -name 'fabric-rendering-v1-*.jar' | grep -v sources | head -1)
          javap -cp "$F:$J" net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents
          javap -cp "$F:$J" net.fabricmc.fabric.api.client.rendering.v1.hud.HudElement
          javap -cp "$F:$J" net.fabricmc.fabric.api.client.rendering.v1.hud.HudElementRegistry | grep static
          javap -cp "$F:$J" 'net.fabricmc.fabric.api.client.rendering.v1.level.LevelRenderEvents$EndMain' 2>/dev/null
          for c in $(unzip -l "$F" | grep -Eo 'net/fabricmc/fabric/api/client/rendering/v1/level/LevelRenderEvents\$[A-Za-z]+' | sort -u); do javap -cp "$F:$J" "${c//\//.}" | grep -v '^Compiled'; done
          M=$(find ~/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api -name 'fabric-message-api-v1-*.jar' | grep -v sources | head -1)
          javap -cp "$M:$J" net.fabricmc.fabric.api.client.message.v1.ClientReceiveMessageEvents
          for c in $(unzip -l "$M" | grep -Eo 'net/fabricmc/fabric/api/client/message/v1/ClientReceiveMessageEvents\$[A-Za-z]+' | sort -u); do javap -cp "$M:$J" "${c//\//.}" | grep -v '^Compiled'; done
          echo "=====END====="

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BreedingIndicator
          path: BreedingIndicator/build/libs/BreedingIndicator-*.jar
