name: Build Fabric mod

on:
  push:
    paths: ["BreedingIndicator/**", ".github/workflows/mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BreedingIndicator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-cleanup: never

      - name: Resolve Fabric versions for 26.1.2
        run: |
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '.[0].version')
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o '<version>[^<]*+26.1.2</version>' | tail -1 | sed 's/<[^>]*>//g')
          LOOM=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-loom/net.fabricmc.fabric-loom.gradle.plugin/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tail -5 | sed 's/<[^>]*>//g' | tr '\n' ' ')
          echo "loader=$LOADER api=$API loom-candidates=$LOOM"
          echo "PROPS=-Ploader_version=$LOADER -Pfabric_version=$API" >> $GITHUB_ENV

      - name: Build
        run: gradle build --no-daemon $PROPS

      - name: Probe
        if: always()
        run: |
          J=$(find ~/.gradle/caches/fabric-loom -name 'minecraft-merged-deobf-*.jar' | head -1)
          echo "=====PROBE====="
          unzip -l "$J" | grep -Eo 'net/minecraft/gizmos/[A-Za-z]+\.class'
          javap -cp "$J" net.minecraft.gizmos.Gizmos | grep static
          javap -cp "$J" net.minecraft.gizmos.GizmoStyle | grep static
          javap -cp "$J" net.minecraft.client.gui.GuiGraphics | grep -E 'drawString|fill\(|text' | head -12
          javap -cp "$J" net.minecraft.client.gui.screens.inventory.AbstractContainerScreen | grep -Ei 'menu|render\(' | head
          javap -cp "$J" net.minecraft.world.inventory.AbstractContainerMenu | grep -E 'slots|getItems'
          for f in $(find ~/.gradle/caches/modules-2/files-2.1/net.fabricmc.fabric-api -name '*.jar' | grep -E 'rendering-v1|message-api|screen-api|command-api-v2' | grep -v sources); do echo "## $f"; unzip -l "$f" | grep -Eo 'net/fabricmc/fabric/api/client/[^ ]*\.class' | grep -v '\$' ; done
          echo "=====END====="

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BreedingIndicator
          path: BreedingIndicator/build/libs/BreedingIndicator-*.jar
